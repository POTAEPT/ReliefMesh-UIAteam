services:
  db:
    image: postgres:15-alpine
    container_name: reliefmesh-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: reliefmesh
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/schema/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: