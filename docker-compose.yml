
services:
  postgres-db:
    image: postgres:15-alpine 
    container_name: emergency_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword 
      POSTGRES_DB: mesh_network
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M # Resource Logic: ตีกรอบ RAM ไว้ที่ 512MB ป้องกันไม่ให้ DB ดึงทรัพยากรเครื่องจนโน้ตบุ๊กเต้ค้าง
    volumes:
      - pgdata:/var/lib/postgresql/data 
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: